<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 440 860" width="440" height="860">

  <defs>
    <style>
      
@import url('https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700&amp;family=Inter:wght@400;500;600;700&amp;family=JetBrains+Mono:wght@500;700&amp;display=swap');
* { box-sizing: border-box; }
.cinzel { font-family: 'Cinzel', serif; letter-spacing: 0.5px; }
.inter { font-family: 'Inter', sans-serif; }
.mono { font-family: 'JetBrains Mono', monospace; }

    </style>
    <linearGradient id="goldGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#E8BE62"/>
      <stop offset="50%" stop-color="#D4A34B"/>
      <stop offset="100%" stop-color="#B8862D"/>
    </linearGradient>
    <linearGradient id="goldBorderGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#E5B758"/>
      <stop offset="100%" stop-color="#8A6421"/>
    </linearGradient>
    <linearGradient id="surfaceGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#161426"/>
      <stop offset="100%" stop-color="#0E0D1A"/>
    </linearGradient>
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1A182B"/>
      <stop offset="100%" stop-color="#121120"/>
    </linearGradient>
    <linearGradient id="heroBannerGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#221C35"/>
      <stop offset="50%" stop-color="#171426"/>
      <stop offset="100%" stop-color="#0D0C18"/>
    </linearGradient>
    <linearGradient id="crimsonGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#EF4444"/>
      <stop offset="100%" stop-color="#991B1B"/>
    </linearGradient>
    <linearGradient id="emeraldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10B981"/>
      <stop offset="100%" stop-color="#047857"/>
    </linearGradient>
    <radialGradient id="vignette" cx="50%" cy="20%" r="80%">
      <stop offset="0%" stop-color="#1A162B" stop-opacity="0.7"/>
      <stop offset="100%" stop-color="#080811" stop-opacity="1"/>
    </radialGradient>
    <filter id="shadowSoft" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000000" flood-opacity="0.65"/>
    </filter>
    <filter id="shadowCard" x="-5%" y="-5%" width="110%" height="115%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000000" flood-opacity="0.45"/>
    </filter>
  </defs>

  <!-- Phone Screen Canvas -->
  <rect width="440" height="860" rx="28" fill="#080811"/>
  <rect width="440" height="860" rx="28" fill="url(#vignette)"/>
  <rect x="1" y="1" width="438" height="858" rx="27" fill="none" stroke="#25253E" stroke-width="1.5"/>
  
    <!-- Android Native Status Bar -->
    <g opacity="0.92">
      <text x="26" y="24" class="inter" font-size="12" font-weight="600" fill="#F4F4F8">22:47</text>
      <!-- Camera Punch Hole -->
      <circle cx="220.0" cy="18" r="6" fill="#040408" stroke="#1E1E30" stroke-width="0.8"/>
      <!-- Right Icons: Wifi, Signal, Battery, Percentage (Well-Spaced, Zero Overlap) -->
      <g transform="translate(330, 11) scale(0.583)" stroke="#F4F4F8" stroke-width="2.0" fill="none" stroke-linecap="round" stroke-linejoin="round"><path d="M12 20h.01" />
  <path d="M2 8.82a15 15 0 0 1 20 0" />
  <path d="M5 12.859a10 10 0 0 1 14 0" />
  <path d="M8.5 16.429a5 5 0 0 1 7 0" /></g>
      <path d="M350 24 L360 13 L360 24 Z" fill="#F4F4F8"/>
      <rect x="368" y="13" width="7" height="11" rx="1.5" fill="#F4F4F8"/>
      <rect x="370" y="11" width="3" height="2" rx="0.5" fill="#F4F4F8"/>
      <text x="416" y="23" class="inter" font-size="11" font-weight="700" fill="#F4F4F8" text-anchor="end">87%</text>
    </g>
    
  
    <!-- Mobile Modal Sheet Container -->
    <rect x="8" y="38" width="424" height="814" rx="24" fill="url(#surfaceGrad)" stroke="#2A2640" stroke-width="1.2" filter="url(#shadowSoft)"/>
    <!-- Drag Handle Pill -->
    <rect x="198.0" y="46" width="44" height="4" rx="2" fill="#D4A34B" fill-opacity="0.45"/>

    <!-- Header Icon Emblem (Octagonal/Heraldic Box) -->
    <g transform="translate(24, 56)">
      <rect width="46" height="46" rx="12" fill="#1C192E" stroke="url(#goldBorderGrad)" stroke-width="1.5"/>
      <rect x="3" y="3" width="40" height="40" rx="9" fill="none" stroke="#D4A34B" stroke-width="0.6" stroke-opacity="0.4"/>
      <g transform="translate(11, 11) scale(1.000)" stroke="#E5B758" stroke-width="1.9" fill="none" stroke-linecap="round" stroke-linejoin="round"><path d="M14.086 18.412A2 2 0 0112.67 19H5v-7.672a2 2 0 01.586-1.414L11.75 3.75a6 6 0 118.49 8.49z" />
  <path d="M16 8 2 22" />
  <path d="M17.488 15H9" /></g>
    </g>

    <!-- Title & Subtitle -->
    <text x="80" y="75" class="cinzel" font-size="15.0" font-weight="700" fill="#E5B758">CANDIDATURA À MESA</text>
    <text x="80" y="95" class="inter" font-size="11.5" fill="#9CA3AF">Solicitação Formal de Entrada no Grupo</text>
    
        <rect x="312.5" y="60" width="61.5" height="24" rx="12" fill="#10B981" fill-opacity="0.16" stroke="#10B981" stroke-width="1.2"/>
        <text x="343.25" y="76" class="inter" font-size="9.5" font-weight="700" fill="#10B981" text-anchor="middle">2 VAGAS</text>
        
    
        <g cursor="pointer">
          <rect x="384" y="54" width="34" height="34" rx="10" fill="#18182C" stroke="#25253E" stroke-width="1.2"/>
          <g transform="translate(392, 62) scale(0.750)" stroke="#9CA3AF" stroke-width="2.0" fill="none" stroke-linecap="round" stroke-linejoin="round"><path d="M18 6 6 18" />
  <path d="m6 6 12 12" /></g>
        </g>
        

    <!-- Ornamental Gold Divider with Center Diamond (Inspired by Guide Image) -->
    <line x1="24" y1="116" x2="214.0" y2="116" stroke="#D4A34B" stroke-width="1" stroke-opacity="0.5"/>
    <polygon points="220.0,112 225.0,116 220.0,120 215.0,116" fill="#131322" stroke="#E5B758" stroke-width="1.3"/>
    <line x1="226.0" y1="116" x2="416" y2="116" stroke="#D4A34B" stroke-width="1" stroke-opacity="0.5"/>
    
  
    <!-- Seção Resumo da Mesa -->
    
    <g>
      <g transform="translate(24, 135) scale(0.833)" stroke="#E5B758" stroke-width="1.8" fill="none" stroke-linecap="round" stroke-linejoin="round"><path d="m13 19 6-6" />
  <path d="M14.5 17.5 3.586 6.586A2 2 0 013 5.172V3h2.172a2 2 0 011.414.586L17.5 14.5" />
  <path d="m14.828 6.172 2.586-2.586A2 2 0 0118.828 3H21v2.172a2 2 0 01-.586 1.414l-2.586 2.586" />
  <path d="m16 16 4 4" />
  <path d="m19 21 2-2" />
  <path d="m5 14 4 4" />
  <path d="m5 21-2-2" />
  <path d="M7.5 16.5 4 20" /></g>
      <text x="52" y="151" class="cinzel" font-size="14.5" font-weight="700" fill="#F4F4F8">Mesa Selecionada</text>
      <line x1="235.6" y1="146" x2="401" y2="146" stroke="#D4A34B" stroke-width="1" stroke-opacity="0.55"/>
      <polygon points="406,142 410,146 406,150 402,146" fill="none" stroke="#D4A34B" stroke-width="1.2"/>
      
    </g>
    

    
    <rect x="24" y="168" width="392" height="114" rx="14" fill="url(#cardGrad)" stroke="#D4A34B" stroke-width="1.3"  filter="url(#shadowCard)"/>
    <rect x="28" y="172" width="384" height="106" rx="10" fill="none" stroke="#E5B758" stroke-width="0.6" stroke-opacity="0.22"/>
    
    <g transform="translate(42, 190)">
      <circle cx="30" cy="30" r="30" fill="#1C182B" stroke="#E5B758" stroke-width="1.8"/>
      <g transform="translate(16, 16) scale(1.167)" stroke="#E5B758" stroke-width="1.8" fill="none" stroke-linecap="round" stroke-linejoin="round"><path d="m13 19 6-6" />
  <path d="M14.5 17.5 3.586 6.586A2 2 0 013 5.172V3h2.172a2 2 0 011.414.586L17.5 14.5" />
  <path d="m14.828 6.172 2.586-2.586A2 2 0 0118.828 3H21v2.172a2 2 0 01-.586 1.414l-2.586 2.586" />
  <path d="m16 16 4 4" />
  <path d="m19 21 2-2" />
  <path d="m5 14 4 4" />
  <path d="m5 21-2-2" />
  <path d="M7.5 16.5 4 20" /></g>
    </g>
    <text x="118" y="200" class="cinzel" font-size="16" font-weight="700" fill="#F4F4F8">O Chamado das Profundezas</text>
    <text x="118" y="222" class="inter" font-size="12" fill="#9CA3AF">Mestre: <tspan fill="#E5B758">@lucas_gm</tspan> • Sistema AlphaD6</text>
    <g transform="translate(118, 236)">
      <rect width="88" height="24" rx="6" fill="#10B981" fill-opacity="0.16" stroke="#10B981" stroke-width="1"/>
      <text x="44" y="16" class="mono" font-size="10" font-weight="700" fill="#10B981" text-anchor="middle">Vagas: 2 / 5</text>
      <rect x="98" width="94" height="24" rx="6" fill="#2A2218" stroke="#D4A34B" stroke-width="1"/>
      <text x="145" y="16" class="inter" font-size="10" font-weight="700" fill="#E5B758" text-anchor="middle">Terças 20h</text>
    </g>

    <!-- Regra Rígida de Criação de Personagem -->
    
    <rect x="24" y="302" width="392" height="82" rx="14" fill="#111E2E" stroke="#06B6D4" stroke-width="1.3"  filter="url(#shadowCard)"/>
    <rect x="28" y="306" width="384" height="74" rx="10" fill="none" stroke="#06B6D4" stroke-width="0.6" stroke-opacity="0.22"/>
    
    <g transform="translate(42, 322) scale(0.917)" stroke="#06B6D4" stroke-width="2.0" fill="none" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10" />
  <path d="M12 16v-4" />
  <path d="M12 8h.01" /></g>
    <text x="74" y="332" class="inter" font-size="12" font-weight="700" fill="#06B6D4">REGRA OFICIAL DE CRIAÇÃO DE FICHA</text>
    <text x="74" y="352" class="inter" font-size="11" fill="#CFFAFE">A ficha do seu herói será liberada automaticamente</text>
    <text x="74" y="368" class="inter" font-size="11" fill="#CFFAFE">assim que o Mestre aprovar sua candidatura na mesa.</text>

    <!-- Seção Mensagem de Apresentação -->
    
    <g>
      <g transform="translate(24, 407) scale(0.833)" stroke="#E5B758" stroke-width="1.8" fill="none" stroke-linecap="round" stroke-linejoin="round"><path d="M14.086 18.412A2 2 0 0112.67 19H5v-7.672a2 2 0 01.586-1.414L11.75 3.75a6 6 0 118.49 8.49z" />
  <path d="M16 8 2 22" />
  <path d="M17.488 15H9" /></g>
      <text x="52" y="423" class="cinzel" font-size="14.5" font-weight="700" fill="#F4F4F8">Apresentação ao Mestre</text>
      <line x1="299.2" y1="418" x2="401" y2="418" stroke="#D4A34B" stroke-width="1" stroke-opacity="0.55"/>
      <polygon points="406,414 410,418 406,422 402,418" fill="none" stroke="#D4A34B" stroke-width="1.2"/>
      
    </g>
    

    <g transform="translate(24, 444)">
      <rect width="392" height="164" rx="14" fill="#0D0D18" stroke="#2D2C46" stroke-width="1.3"/>
      <text x="18" y="32" class="inter" font-size="13" fill="#F4F4F8">Olá Mestre Lucas! Jogo RPG há 3 anos e conheço bem</text>
      <text x="18" y="56" class="inter" font-size="13" fill="#F4F4F8">as regras do AlphaD6. Gostaria de atuar com um herói</text>
      <text x="18" y="80" class="inter" font-size="13" fill="#F4F4F8">de suporte arcano e investigação. Tenho disponibilidade</text>
      <text x="18" y="104" class="inter" font-size="13" fill="#F4F4F8">total para as sessões semanais de terça-feira!</text>
      <line x1="18" y1="128" x2="374" y2="128" stroke="#25253E" stroke-width="1"/>
      <g transform="translate(18, 138) scale(0.583)" stroke="#10B981" stroke-width="2.2" fill="none" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6 9 17l-5-5" /></g>
      <text x="38" y="150" class="inter" font-size="11" fill="#9CA3AF">Disponibilidade confirmada</text>
      <text x="374" y="150" class="mono" font-size="11" font-weight="700" fill="#10B981" text-anchor="end">168 / 200</text>
    </g>

    <!-- Botões de Ação -->
    
    <g cursor="pointer">
      <rect x="24" y="636" width="392" height="56" rx="28.0" fill="url(#goldGradient)" stroke="#F3D078" stroke-width="1" filter="url(#shadowCard)"/>
      <rect x="28" y="640" width="384" height="48" rx="24.0" fill="none" stroke="#090910" stroke-width="1" stroke-opacity="0.3"/>
      <g transform="translate(98.60000000000001, 654.0) scale(0.833)" stroke="#090910" stroke-width="2.2" fill="none" stroke-linecap="round" stroke-linejoin="round"><path d="m22 7-8.991 5.727a2 2 0 0 1-2.009 0L2 7" />
  <rect x="2" y="4" width="20" height="16" rx="2" /></g>
      <text x="235.0" y="669.0" class="inter" font-size="14" font-weight="700" fill="#090910" text-anchor="middle">Enviar Candidatura ao Mestre</text>
    </g>
    
    
    <g cursor="pointer">
      <rect x="24" y="708" width="392" height="50" rx="12" fill="#18182C" stroke="#2E2D48" stroke-width="1.2"/>
      <g transform="translate(137.0, 724.0) scale(0.750)" stroke="#9CA3AF" stroke-width="2.0" fill="none" stroke-linecap="round" stroke-linejoin="round"><path d="M18 6 6 18" />
  <path d="m6 6 12 12" /></g>
      <text x="233.0" y="738.0" class="inter" font-size="13" font-weight="600" fill="#E2E8F0" text-anchor="middle">Cancelar Solicitação</text>
    </g>
    

    <text x="220" y="798" class="inter" font-size="11" fill="#64687A" text-anchor="middle">O Mestre receberá um alerta instantâneo na Top Bar</text>
    
  
    <!-- Android Bottom Gesture Pill -->
    <rect x="166.0" y="846" width="108" height="4" rx="2" fill="#E5B758" fill-opacity="0.35"/>
    
</svg>