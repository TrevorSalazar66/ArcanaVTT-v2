<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 440 920" width="440" height="920">

  <defs>
    <style>
      
@import url('https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700&amp;family=Inter:wght@400;500;600;700&amp;family=JetBrains+Mono:wght@500;700&amp;display=swap');
* { box-sizing: border-box; }
.cinzel { font-family: 'Cinzel', serif; letter-spacing: 0.5px; }
.inter { font-family: 'Inter', sans-serif; }
.mono { font-family: 'JetBrains Mono', monospace; }

    </style>
    <linearGradient id="goldGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#E8BE62"/>
      <stop offset="50%" stop-color="#D4A34B"/>
      <stop offset="100%" stop-color="#B8862D"/>
    </linearGradient>
    <linearGradient id="goldBorderGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#E5B758"/>
      <stop offset="100%" stop-color="#8A6421"/>
    </linearGradient>
    <linearGradient id="surfaceGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#161426"/>
      <stop offset="100%" stop-color="#0E0D1A"/>
    </linearGradient>
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1A182B"/>
      <stop offset="100%" stop-color="#121120"/>
    </linearGradient>
    <linearGradient id="heroBannerGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#221C35"/>
      <stop offset="50%" stop-color="#171426"/>
      <stop offset="100%" stop-color="#0D0C18"/>
    </linearGradient>
    <linearGradient id="crimsonGrad" x1="0%" y1="0%" x2="100%" y2="100%">
