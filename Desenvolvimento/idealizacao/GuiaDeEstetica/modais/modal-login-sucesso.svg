    <radialGradient id="vignette" cx="50%" cy="20%" r="80%">
      <stop offset="0%" stop-color="#1A162B" stop-opacity="0.7"/>
      <stop offset="100%" stop-color="#080811" stop-opacity="1"/>
    </radialGradient>
    <filter id="shadowSoft" x="-10%" y="-10%" width="120%" height="120%">
