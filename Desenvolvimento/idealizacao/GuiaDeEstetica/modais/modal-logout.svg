<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 440 740" width="440" height="740">

  <defs>
    <style>
      
@import url('https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700&amp;family=Inter:wght@400;500;600;700&amp;family=JetBrains+Mono:wght@500;700&amp;display=swap');
* { box-sizing: border-box; }
.cinzel { font-family: 'Cinzel', serif; letter-spacing: 0.5px; }
.inter { font-family: 'Inter', sans-serif; }
.mono { font-family: 'JetBrains Mono', monospace; }

    </style>
    <linearGradient id="goldGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#E8BE62"/>
      <stop offset="50%" stop-color="#D4A34B"/>
      <stop offset="100%" stop-color="#B8862D"/>
    </linearGradient>
    <linearGradient id="goldBorderGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#E5B758"/>
      <stop offset="100%" stop-color="#8A6421"/>
    </linearGradient>
    <linearGradient id="surfaceGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#161426"/>
      <stop offset="100%" stop-color="#0E0D1A"/>
    </linearGradient>
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1A182B"/>
      <stop offset="100%" stop-color="#121120"/>
    </linearGradient>
    <linearGradient id="heroBannerGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#221C35"/>
      <stop offset="50%" stop-color="#171426"/>
      <stop offset="100%" stop-color="#0D0C18"/>
    </linearGradient>
    <linearGradient id="crimsonGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#EF4444"/>
      <stop offset="100%" stop-color="#991B1B"/>
    </linearGradient>
    <linearGradient id="emeraldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10B981"/>
      <stop offset="100%" stop-color="#047857"/>
    </linearGradient>
    <radialGradient id="vignette" cx="50%" cy="20%" r="80%">
      <stop offset="0%" stop-color="#1A162B" stop-opacity="0.7"/>
      <stop offset="100%" stop-color="#080811" stop-opacity="1"/>
    </radialGradient>
    <filter id="shadowSoft" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000000" flood-opacity="0.65"/>
    </filter>
    <filter id="shadowCard" x="-5%" y="-5%" width="110%" height="115%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000000" flood-opacity="0.45"/>
    </filter>
  </defs>

  <!-- Phone Screen Canvas -->
  <rect width="440" height="740" rx="28" fill="#080811"/>
  <rect width="440" height="740" rx="28" fill="url(#vignette)"/>
  <rect x="1" y="1" width="438" height="738" rx="27" fill="none" stroke="#25253E" stroke-width="1.5"/>
  
    <!-- Android Native Status Bar -->
    <g opacity="0.92">
      <text x="26" y="24" class="inter" font-size="12" font-weight="600" fill="#F4F4F8">22:47</text>
      <!-- Camera Punch Hole -->
      <circle cx="220.0" cy="18" r="6" fill="#040408" stroke="#1E1E30" stroke-width="0.8"/>
      <!-- Right Icons: Wifi, Signal, Battery, Percentage (Well-Spaced, Zero Overlap) -->
      <g transform="translate(330, 11) scale(0.583)" stroke="#F4F4F8" stroke-width="2.0" fill="none" stroke-linecap="round" stroke-linejoin="round"><path d="M12 20h.01" />
  <path d="M2 8.82a15 15 0 0 1 20 0" />
  <path d="M5 12.859a10 10 0 0 1 14 0" />
  <path d="M8.5 16.429a5 5 0 0 1 7 0" /></g>
      <path d="M350 24 L360 13 L360 24 Z" fill="#F4F4F8"/>
      <rect x="368" y="13" width="7" height="11" rx="1.5" fill="#F4F4F8"/>
      <rect x="370" y="11" width="3" height="2" rx="0.5" fill="#F4F4F8"/>
      <text x="416" y="23" class="inter" font-size="11" font-weight="700" fill="#F4F4F8" text-anchor="end">87%</text>
    </g>
    
  
    <!-- Mobile Modal Sheet Container -->
    <rect x="8" y="38" width="424" height="694" rx="24" fill="url(#surfaceGrad)" stroke="#2A2640" stroke-width="1.2" filter="url(#shadowSoft)"/>
    <!-- Drag Handle Pill -->
    <rect x="198.0" y="46" width="44" height="4" rx="2" fill="#D4A34B" fill-opacity="0.45"/>

    <!-- Header Icon Emblem (Octagonal/Heraldic Box) -->
    <g transform="translate(24, 56)">
      <rect width="46" height="46" rx="12" fill="#1C192E" stroke="url(#goldBorderGrad)" stroke-width="1.5"/>
      <rect x="3" y="3" width="40" height="40" rx="9" fill="none" stroke="#D4A34B" stroke-width="0.6" stroke-opacity="0.4"/>
      <g transform="translate(11, 11) scale(1.000)" stroke="#E5B758" stroke-width="1.9" fill="none" stroke-linecap="round" stroke-linejoin="round"><path d="m16 17 5-5-5-5" />
  <path d="M21 12H9" />
  <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4" /></g>
    </g>

    <!-- Title & Subtitle -->
    <text x="80" y="75" class="cinzel" font-size="16.0" font-weight="700" fill="#E5B758">ENCERRAR SESSÃO</text>
    <text x="80" y="95" class="inter" font-size="11.5" fill="#9CA3AF">Desconexão Segura da Conta</text>
    
        <rect x="299.5" y="60" width="74.5" height="24" rx="12" fill="#EF4444" fill-opacity="0.16" stroke="#EF4444" stroke-width="1.2"/>
        <text x="336.75" y="76" class="inter" font-size="9.5" font-weight="700" fill="#EF4444" text-anchor="middle">SEGURANÇA</text>
        
    
        <g cursor="pointer">
          <rect x="384" y="54" width="34" height="34" rx="10" fill="#18182C" stroke="#25253E" stroke-width="1.2"/>
          <g transform="translate(392, 62) scale(0.750)" stroke="#9CA3AF" stroke-width="2.0" fill="none" stroke-linecap="round" stroke-linejoin="round"><path d="M18 6 6 18" />
  <path d="m6 6 12 12" /></g>
        </g>
        

    <!-- Ornamental Gold Divider with Center Diamond (Inspired by Guide Image) -->
    <line x1="24" y1="116" x2="214.0" y2="116" stroke="#D4A34B" stroke-width="1" stroke-opacity="0.5"/>
    <polygon points="220.0,112 225.0,116 220.0,120 215.0,116" fill="#131322" stroke="#E5B758" stroke-width="1.3"/>
    <line x1="226.0" y1="116" x2="416" y2="116" stroke="#D4A34B" stroke-width="1" stroke-opacity="0.5"/>
    
  
    <!-- Card Central de Alerta de Desconexão -->
    
    <rect x="24" y="136" width="392" height="168" rx="14" fill="#241118" stroke="#EF4444" stroke-width="1.3"  filter="url(#shadowCard)"/>
    <rect x="28" y="140" width="384" height="160" rx="10" fill="none" stroke="#EF4444" stroke-width="0.6" stroke-opacity="0.22"/>
    
    <g transform="translate(220, 188)">
      <circle r="32" fill="#3B1219" stroke="#EF4444" stroke-width="1.8"/>
      <g transform="translate(-14, -14) scale(1.167)" stroke="#EF4444" stroke-width="2.2" fill="none" stroke-linecap="round" stroke-linejoin="round"><path d="m16 17 5-5-5-5" />
  <path d="M21 12H9" />
  <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4" /></g>
    </g>
    <text x="220" y="248" class="cinzel" font-size="18" font-weight="700" fill="#F4F4F8" text-anchor="middle">Deseja Encerrar a Sessão?</text>
    <text x="220" y="272" class="inter" font-size="12" fill="#FCA5A5" text-anchor="middle">Você precisará autenticar o Google OAuth ao retornar</text>

    <!-- Seção Protocolo Criptográfico -->
    
    <g>
      <g transform="translate(24, 325) scale(0.833)" stroke="#E5B758" stroke-width="1.8" fill="none" stroke-linecap="round" stroke-linejoin="round"><path d="M20 13c0 5-3.5 7.5-7.66 8.95a1 1 0 0 1-.67-.01C7.5 20.5 4 18 4 13V6a1 1 0 0 1 1-1c2 0 4.5-1.2 6.24-2.72a1.17 1.17 0 0 1 1.52 0C14.51 3.81 17 5 19 5a1 1 0 0 1 1 1z" /></g>
      <text x="52" y="341" class="cinzel" font-size="13.5" font-weight="700" fill="#F4F4F8">Sanitização de Segurança Local</text>
      <line x1="360.0" y1="336" x2="401" y2="336" stroke="#D4A34B" stroke-width="1" stroke-opacity="0.55"/>
      <polygon points="406,332 410,336 406,340 402,336" fill="none" stroke="#D4A34B" stroke-width="1.2"/>
      
    </g>
    

    
    <rect x="24" y="358" width="392" height="164" rx="14" fill="url(#cardGrad)" stroke="#282640" stroke-width="1.3"  filter="url(#shadowCard)"/>
    <rect x="28" y="362" width="384" height="156" rx="10" fill="none" stroke="#D4A34B" stroke-width="0.6" stroke-opacity="0.22"/>
    
    <g transform="translate(42, 380)">
      <g transform="translate(0, 0) scale(0.750)" stroke="#10B981" stroke-width="2.4" fill="none" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6 9 17l-5-5" /></g>
      <text x="28" y="14" class="inter" font-size="12" font-weight="600" fill="#F4F4F8">1. Revogação imediata do Token JWT no Edge</text>
      <text x="28" y="32" class="inter" font-size="11" fill="#9CA3AF">Invalida a sessão ativa nos servidores Cloudflare.</text>

      <g transform="translate(0, 52) scale(0.750)" stroke="#10B981" stroke-width="2.4" fill="none" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6 9 17l-5-5" /></g>
      <text x="28" y="66" class="inter" font-size="12" font-weight="600" fill="#F4F4F8">2. Limpeza de chaves no Android Keystore</text>
      <text x="28" y="84" class="inter" font-size="11" fill="#9CA3AF">Remove credenciais biométricas e tokens locais.</text>

      <g transform="translate(0, 104) scale(0.750)" stroke="#10B981" stroke-width="2.4" fill="none" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6 9 17l-5-5" /></g>
      <text x="28" y="118" class="inter" font-size="12" font-weight="600" fill="#F4F4F8">3. Desconexão limpa dos túneis P2P Mesh</text>
    </g>

    <!-- Botões de Ação Bem Separados -->
    
    <g cursor="pointer">
      <rect x="24" y="550" width="392" height="54" rx="12" fill="#281219" stroke="#EF4444" stroke-width="1.2"/>
      <g transform="translate(98.5, 568.0) scale(0.750)" stroke="#EF4444" stroke-width="2.0" fill="none" stroke-linecap="round" stroke-linejoin="round"><path d="m16 17 5-5-5-5" />
  <path d="M21 12H9" />
  <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4" /></g>
      <text x="233.0" y="582.0" class="inter" font-size="13" font-weight="600" fill="#FCA5A5" text-anchor="middle">Confirmar Logout e Limpar Chave</text>
    </g>
    
    
    <g cursor="pointer">
      <rect x="24" y="620" width="392" height="54" rx="27.0" fill="url(#goldGradient)" stroke="#F3D078" stroke-width="1" filter="url(#shadowCard)"/>
      <rect x="28" y="624" width="384" height="46" rx="23.0" fill="none" stroke="#090910" stroke-width="1" stroke-opacity="0.3"/>
      <g transform="translate(87.19999999999999, 637.0) scale(0.833)" stroke="#090910" stroke-width="2.2" fill="none" stroke-linecap="round" stroke-linejoin="round"><path d="M20 13c0 5-3.5 7.5-7.66 8.95a1 1 0 0 1-.67-.01C7.5 20.5 4 18 4 13V6a1 1 0 0 1 1-1c2 0 4.5-1.2 6.24-2.72a1.17 1.17 0 0 1 1.52 0C14.51 3.81 17 5 19 5a1 1 0 0 1 1 1z" /></g>
      <text x="235.0" y="652.0" class="inter" font-size="14" font-weight="700" fill="#090910" text-anchor="middle">Permanecer Conectado na Taverna</text>
    </g>
    
    
  
    <!-- Android Bottom Gesture Pill -->
    <rect x="166.0" y="726" width="108" height="4" rx="2" fill="#E5B758" fill-opacity="0.35"/>
    
</svg>