    <text x="104" y="518" class="inter" font-size="12" fill="#9CA3AF">Mestre: <tspan fill="#E5B758">@gabriel_mestre</tspan> • AlphaD6 RPG</text>
    <line x1="42" y1="534" x2="396" y2="534" stroke="#282640" stroke-width="1"/>
    <text x="42" y="558" class="mono" font-size="11" fill="#10B981">Vagas Abertas: 1 / 5 • Sessão Ao Vivo Agora</text>

