    <text x="24" y="182" class="inter" font-size="12" fill="#9CA3AF">Digite o código informado pelo Mestre da sessão:</text>

    <!-- 6 Slots Bem Espaçados (Zero Sobreposição: 6 * 56px + 5 * 11px = 391px) -->
    <g transform="translate(24, 198)">
      <!-- Slot 1 -->
