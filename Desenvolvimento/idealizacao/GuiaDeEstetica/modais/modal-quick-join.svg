    <text x="80" y="95" class="inter" font-size="11.5" fill="#9CA3AF">Ingresso Instantâneo via Código ou QR</text>
    
        <rect x="293.0" y="60" width="81.0" height="24" rx="12" fill="#E5B758" fill-opacity="0.16" stroke="#E5B758" stroke-width="1.2"/>
