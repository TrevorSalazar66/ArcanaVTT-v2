      <polygon points="0,-22 19,-11 19,11 0,22 -19,11 -19,-11" fill="none" stroke="#D4A34B" stroke-width="1.2"/>
      <g transform="translate(-11, -11) scale(0.917)" stroke="#E5B758" stroke-width="1.8" fill="none" stroke-linecap="round" stroke-linejoin="round"><rect width="12" height="12" x="2" y="10" rx="2" ry="2" />
  <path d="m17.92 14 3.5-3.5a2.24 2.24 0 0 0 0-3l-5-4.92a2.24 2.24 0 0 0-3 0L10 6" />
  <path d="M6 18h.01" />
  <path d="M10 14h.01" />
  <path d="M15 6h.01" />
  <path d="M18 9h.01" /></g>
    </g>
    <text x="220" y="228" class="cinzel" font-size="16" font-weight="700" fill="#F4F4F8" text-anchor="middle">Saudações, Aventureiro</text>
    <text x="220" y="250" class="inter" font-size="12" fill="#9CA3AF" text-anchor="middle">Acesso exclusivo e sem senhas via Google OAuth 2.0</text>

    <!-- Seção Autenticação Oficial OAuth 2.0 -->
    
    <g>
      <g transform="translate(24, 287) scale(0.833)" stroke="#E5B758" stroke-width="1.8" fill="none" stroke-linecap="round" stroke-linejoin="round"><path d="M20 13c0 5-3.5 7.5-7.66 8.95a1 1 0 0 1-.67-.01C7.5 20.5 4 18 4 13V6a1 1 0 0 1 1-1c2 0 4.5-1.2 6.24-2.72a1.17 1.17 0 0 1 1.52 0C14.51 3.81 17 5 19 5a1 1 0 0 1 1 1z" /></g>
      <text x="52" y="303" class="cinzel" font-size="13.5" font-weight="700" fill="#F4F4F8">Autenticação Google OAuth</text>
      <line x1="311.0" y1="298" x2="401" y2="298" stroke="#D4A34B" stroke-width="1" stroke-opacity="0.55"/>
      <polygon points="406,294 410,298 406,302 402,298" fill="none" stroke="#D4A34B" stroke-width="1.2"/>
      
    </g>
    

    <!-- Card Conta Google Detectada no Android (1-Tap) -->
    
    <rect x="24" y="320" width="392" height="92" rx="14" fill="url(#cardGrad)" stroke="#D4A34B" stroke-width="1.3"  filter="url(#shadowCard)"/>
    <rect x="28" y="324" width="384" height="84" rx="10" fill="none" stroke="#E5B758" stroke-width="0.6" stroke-opacity="0.22"/>
    
