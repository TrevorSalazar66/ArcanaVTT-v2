      <rect x="28" y="434" width="384" height="50" rx="25.0" fill="none" stroke="#090910" stroke-width="1" stroke-opacity="0.3"/>
      <g transform="translate(117.60000000000001, 449.0) scale(0.833)" stroke="#090910" stroke-width="2.2" fill="none" stroke-linecap="round" stroke-linejoin="round"><path d="M11.017 2.814a1 1 0 0 1 1.966 0l1.051 5.558a2 2 0 0 0 1.594 1.594l5.558 1.051a1 1 0 0 1 0 1.966l-5.558 1.051a2 2 0 0 0-1.594 1.594l-1.051 5.558a1 1 0 0 1-1.966 0l-1.051-5.558a2 2 0 0 0-1.594-1.594l-5.558-1.051a1 1 0 0 1 0-1.966l5.558-1.051a2 2 0 0 0 1.594-1.594z" />
  <path d="M20 2v4" />
  <path d="M22 4h-4" />
  <circle cx="4" cy="20" r="2" /></g>
      <text x="235.0" y="464.0" class="inter" font-size="14" font-weight="700" fill="#090910" text-anchor="middle">Entrar com Conta Google</text>
    </g>
    

    <!-- Botão Secundário: Escolher Outra Conta Google -->
    
    <g cursor="pointer">
      <rect x="24" y="502" width="392" height="48" rx="12" fill="#1F1B2C" stroke="#D4A34B" stroke-width="1.2"/>
      <g transform="translate(67.0, 517.0) scale(0.750)" stroke="#E5B758" stroke-width="2.0" fill="none" stroke-linecap="round" stroke-linejoin="round"><path d="M19 21v-2a4 4 0 0 0-4-4H9a4 4 0 0 0-4 4v2" />
  <circle cx="12" cy="7" r="4" /></g>
      <text x="233.0" y="531.0" class="inter" font-size="13" font-weight="600" fill="#E5B758" text-anchor="middle">Selecionar Outra Conta Google no Android</text>
    </g>
    

    <!-- Seção Segurança do Aparelho -->
    
    <g>
      <g transform="translate(24, 573) scale(0.833)" stroke="#E5B758" stroke-width="1.8" fill="none" stroke-linecap="round" stroke-linejoin="round"><rect width="18" height="11" x="3" y="11" rx="2" ry="2" />
  <path d="M7 11V7a5 5 0 0 1 10 0v4" /></g>
      <text x="52" y="589" class="cinzel" font-size="13.5" font-weight="700" fill="#F4F4F8">Segurança &amp; Sessão Persistente</text>
      <line x1="360.0" y1="584" x2="401" y2="584" stroke="#D4A34B" stroke-width="1" stroke-opacity="0.55"/>
      <polygon points="406,580 410,584 406,588 402,584" fill="none" stroke="#D4A34B" stroke-width="1.2"/>
      
    </g>
    

    <!-- Card Dispositivo Confiável -->
    
    <rect x="24" y="606" width="392" height="64" rx="14" fill="url(#cardGrad)" stroke="#282640" stroke-width="1.3"  filter="url(#shadowCard)"/>
    <rect x="28" y="610" width="384" height="56" rx="10" fill="none" stroke="#D4A34B" stroke-width="0.6" stroke-opacity="0.22"/>
    
    <g transform="translate(40, 628) scale(0.833)" stroke="#10B981" stroke-width="2.0" fill="none" stroke-linecap="round" stroke-linejoin="round"><path d="M20 13c0 5-3.5 7.5-7.66 8.95a1 1 0 0 1-.67-.01C7.5 20.5 4 18 4 13V6a1 1 0 0 1 1-1c2 0 4.5-1.2 6.24-2.72a1.17 1.17 0 0 1 1.52 0C14.51 3.81 17 5 19 5a1 1 0 0 1 1 1z" /></g>
    <text x="70" y="633" class="inter" font-size="13" font-weight="600" fill="#F4F4F8">Confiar neste aparelho Android</text>
    <text x="70" y="653" class="inter" font-size="11" fill="#9CA3AF">Sessão automática de 15 a 30 dias via Keystore</text>
    <rect x="358" y="627" width="42" height="22" rx="11" fill="#10B981"/>
    <circle cx="389" cy="638" r="8" fill="#FFFFFF"/>

    <!-- Card Garantias Zero-Custody -->
    
    <rect x="24" y="684" width="392" height="82" rx="14" fill="url(#cardGrad)" stroke="#282640" stroke-width="1.3"  filter="url(#shadowCard)"/>
    <rect x="28" y="688" width="384" height="74" rx="10" fill="none" stroke="#D4A34B" stroke-width="0.6" stroke-opacity="0.22"/>
    
    <g transform="translate(42, 704) scale(0.667)" stroke="#E5B758" stroke-width="2.3" fill="none" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6 9 17l-5-5" /></g>
    <text x="68" y="717" class="inter" font-size="11.5" fill="#F4F4F8">Zero custódia de senhas: login 100% delegado ao Google.</text>
    <g transform="translate(42, 732) scale(0.667)" stroke="#E5B758" stroke-width="2.3" fill="none" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6 9 17l-5-5" /></g>
    <text x="68" y="745" class="inter" font-size="11.5" fill="#9CA3AF">Criação automática de perfil no primeiro acesso OAuth.</text>

    <text x="220" y="802" class="inter" font-size="11" fill="#64687A" text-anchor="middle">Protegido por TLS 1.3 • Conformidade LGPD • 60 FPS</text>
    
  
    <!-- Android Bottom Gesture Pill -->
    <rect x="166.0" y="826" width="108" height="4" rx="2" fill="#E5B758" fill-opacity="0.35"/>
    
</svg>