    </g>
    <text x="100" y="356" class="inter" font-size="14" font-weight="700" fill="#F4F4F8">Conta Google do Aparelho</text>
    <text x="100" y="376" class="mono" font-size="12" fill="#E5B758">arthur.pendelton@gmail.com</text>
    <text x="100" y="396" class="inter" font-size="11" fill="#10B981">Identidade OAuth 2.0 Pronta • Zero Senhas</text>
    <rect x="330" y="344" width="68" height="24" rx="12" fill="#10B981" fill-opacity="0.16" stroke="#10B981" stroke-width="1"/>
    <text x="364" y="360" class="inter" font-size="10" font-weight="700" fill="#10B981" text-anchor="middle">1-Toque</text>

    <!-- Botão Principal Ornado: Entrar com o Google -->
    
    <g cursor="pointer">
