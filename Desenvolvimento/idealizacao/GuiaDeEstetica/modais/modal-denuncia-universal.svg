    <text x="80" y="95" class="inter" font-size="11.5" fill="#9CA3AF">Protocolo de Moderação e Proteção</text>
    
        <rect x="299.5" y="60" width="74.5" height="24" rx="12" fill="#EF4444" fill-opacity="0.16" stroke="#EF4444" stroke-width="1.2"/>
        <text x="336.75" y="76" class="inter" font-size="9.5" font-weight="700" fill="#EF4444" text-anchor="middle">MODERAÇÃO</text>
        
    
