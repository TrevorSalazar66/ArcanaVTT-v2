  <path d="m17.92 14 3.5-3.5a2.24 2.24 0 0 0 0-3l-5-4.92a2.24 2.24 0 0 0-3 0L10 6" />
  <path d="M6 18h.01" />
  <path d="M10 14h.01" />
  <path d="M15 6h.01" />
  <path d="M18 9h.01" /></g>
      <text x="160" y="26" class="inter" font-size="12" font-weight="600" fill="#E5B758">Inserir Fórmulas D6</text>

      <!-- Texto digitado -->
      <text x="18" y="72" class="inter" font-size="12" fill="#F4F4F8">Estou mestrando uma campanha com temática steampunk</text>
      <text x="18" y="96" class="inter" font-size="12" fill="#F4F4F8">e queria ouvir a opinião de outros mestres da Taverna:</text>
      <text x="18" y="124" class="inter" font-size="12" fill="#F4F4F8">Fixar o dano base em 2d6 com a propriedade de recarga</text>
      <text x="18" y="148" class="inter" font-size="12" fill="#F4F4F8">de 1 ação mantém o equilíbrio frente aos arcos longos?</text>
      <text x="374" y="194" class="mono" font-size="11" fill="#10B981" text-anchor="end">218 caracteres</text>
