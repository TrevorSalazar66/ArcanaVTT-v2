    <text x="80" y="75" class="cinzel" font-size="14.0" font-weight="700" fill="#E5B758">NOVO TÓPICO NO FÓRUM</text>
    <text x="80" y="95" class="inter" font-size="11.5" fill="#9CA3AF">Publicação Comunitária da Taverna</text>
    
        <rect x="325.5" y="60" width="48.5" height="24" rx="12" fill="#E5B758" fill-opacity="0.16" stroke="#E5B758" stroke-width="1.2"/>
        <text x="349.75" y="76" class="inter" font-size="9.5" font-weight="700" fill="#E5B758" text-anchor="middle">FÓRUM</text>
        
    
