    <rect x="24" y="168" width="392" height="138" rx="14" fill="url(#cardGrad)" stroke="#282640" stroke-width="1.3"  filter="url(#shadowCard)"/>
    <rect x="28" y="172" width="384" height="130" rx="10" fill="none" stroke="#D4A34B" stroke-width="0.6" stroke-opacity="0.22"/>
    
    <text x="42" y="198" class="inter" font-size="13" fill="#9CA3AF">Tema Visual:</text>
    <text x="396" y="198" class="inter" font-size="13" font-weight="700" fill="#E5B758" text-anchor="end">Escuro Heráldico (Padrão)</text>
    <line x1="42" y1="212" x2="396" y2="212" stroke="#25253E" stroke-width="1"/>

    <text x="42" y="238" class="inter" font-size="13" fill="#9CA3AF">Vibração Tátil (Haptics):</text>
    <text x="396" y="238" class="inter" font-size="13" font-weight="700" fill="#10B981" text-anchor="end">Médio (Ao Rolar Dados)</text>
    <line x1="42" y1="252" x2="396" y2="252" stroke="#25253E" stroke-width="1"/>

    <text x="42" y="278" class="inter" font-size="13" fill="#9CA3AF">Escala Tipográfica:</text>
    <text x="396" y="278" class="mono" font-size="13" font-weight="700" fill="#F4F4F8" text-anchor="end">100% (80% a 150%)</text>

