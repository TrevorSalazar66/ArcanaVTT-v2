      <polygon points="406,332 410,336 406,340 402,336" fill="none" stroke="#D4A34B" stroke-width="1.2"/>
      
    </g>
    

    
    <rect x="24" y="358" width="392" height="162" rx="14" fill="url(#cardGrad)" stroke="#282640" stroke-width="1.3"  filter="url(#shadowCard)"/>
    <rect x="28" y="362" width="384" height="154" rx="10" fill="none" stroke="#D4A34B" stroke-width="0.6" stroke-opacity="0.22"/>
    
    <!-- Canal 1 -->
    <text x="42" y="388" class="inter" font-size="12" fill="#F4F4F8">Geral</text>
    <rect x="130" y="378" width="210" height="10" rx="5" fill="#0D0D18"/>
    <rect x="130" y="378" width="168" height="10" rx="5" fill="url(#goldGradient)"/>
    <text x="396" y="388" class="mono" font-size="12" font-weight="700" fill="#E5B758" text-anchor="end">80%</text>

    <!-- Canal 2 -->
    <text x="42" y="424" class="inter" font-size="12" fill="#F4F4F8">Dados SFX</text>
    <rect x="130" y="414" width="210" height="10" rx="5" fill="#0D0D18"/>
    <rect x="130" y="414" width="210" height="10" rx="5" fill="url(#goldGradient)"/>
    <text x="396" y="424" class="mono" font-size="12" font-weight="700" fill="#E5B758" text-anchor="end">100%</text>

    <!-- Canal 3 -->
    <text x="42" y="460" class="inter" font-size="12" fill="#F4F4F8">Música</text>
    <rect x="130" y="450" width="210" height="10" rx="5" fill="#0D0D18"/>
    <rect x="130" y="450" width="136" height="10" rx="5" fill="url(#goldGradient)"/>
    <text x="396" y="460" class="mono" font-size="12" font-weight="700" fill="#E5B758" text-anchor="end">65%</text>

    <!-- Toggle Silenciar -->
    <text x="42" y="498" class="inter" font-size="12" fill="#9CA3AF">Silenciar automaticamente em 2º plano:</text>
    <text x="396" y="498" class="mono" font-size="12" font-weight="700" fill="#10B981" text-anchor="end">ATIVO</text>

    <!-- Seção 3: Rede P2P & Cache Local -->
    
    <g>
      <g transform="translate(24, 539) scale(0.833)" stroke="#E5B758" stroke-width="1.8" fill="none" stroke-linecap="round" stroke-linejoin="round"><path d="M12 20h.01" />
  <path d="M2 8.82a15 15 0 0 1 20 0" />
  <path d="M5 12.859a10 10 0 0 1 14 0" />
  <path d="M8.5 16.429a5 5 0 0 1 7 0" /></g>
      <text x="52" y="555" class="cinzel" font-size="13.5" font-weight="700" fill="#F4F4F8">Malha P2P &amp; Armazenamento</text>
      <line x1="311.0" y1="550" x2="401" y2="550" stroke="#D4A34B" stroke-width="1" stroke-opacity="0.55"/>
      <polygon points="406,546 410,550 406,554 402,550" fill="none" stroke="#D4A34B" stroke-width="1.2"/>
      
    </g>
    

    
    <rect x="24" y="572" width="392" height="92" rx="14" fill="url(#cardGrad)" stroke="#282640" stroke-width="1.3"  filter="url(#shadowCard)"/>
    <rect x="28" y="576" width="384" height="84" rx="10" fill="none" stroke="#D4A34B" stroke-width="0.6" stroke-opacity="0.22"/>
    
    <text x="42" y="600" class="inter" font-size="13" font-weight="600" fill="#F4F4F8">Cache P2P Local: <tspan fill="#E5B758">142 MB / 1.0 GB</tspan></text>
    <text x="42" y="622" class="inter" font-size="11" fill="#9CA3AF">Mapas e trilhas distribuídos entre os membros da mesa</text>
    <text x="42" y="644" class="inter" font-size="11" font-weight="600" fill="#E5B758">Toque para limpar arquivos temporários</text>
    <g transform="translate(376, 608) scale(0.833)" stroke="#9CA3AF" stroke-width="2.0" fill="none" stroke-linecap="round" stroke-linejoin="round"><path d="M10 11v6" />
  <path d="M14 11v6" />
  <path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6" />
  <path d="M3 6h18" />
  <path d="M8 6V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2" /></g>

    <!-- Seção 4: Segurança & Lockout -->
    
    <g>
      <g transform="translate(24, 683) scale(0.833)" stroke="#E5B758" stroke-width="1.8" fill="none" stroke-linecap="round" stroke-linejoin="round"><rect width="18" height="11" x="3" y="11" rx="2" ry="2" />
  <path d="M7 11V7a5 5 0 0 1 10 0v4" /></g>
      <text x="52" y="699" class="cinzel" font-size="13.5" font-weight="700" fill="#F4F4F8">Segurança &amp; Lockout Global</text>
      <line x1="320.8" y1="694" x2="401" y2="694" stroke="#D4A34B" stroke-width="1" stroke-opacity="0.55"/>
      <polygon points="406,690 410,694 406,698 402,694" fill="none" stroke="#D4A34B" stroke-width="1.2"/>
      
    </g>
    

    
    <rect x="24" y="716" width="392" height="98" rx="14" fill="#241118" stroke="#EF4444" stroke-width="1.3"  filter="url(#shadowCard)"/>
    <rect x="28" y="720" width="384" height="90" rx="10" fill="none" stroke="#EF4444" stroke-width="0.6" stroke-opacity="0.22"/>
    
    <text x="42" y="744" class="inter" font-size="12" font-weight="700" fill="#EF4444">2 APARELHOS CONECTADOS NA CONTA</text>
    <text x="42" y="764" class="inter" font-size="11" fill="#FCA5A5">Android S23 (Atual) • Navegador Desktop Windows</text>
    
    <g cursor="pointer">
      <rect x="42" y="774" width="356" height="32" rx="12" fill="#281219" stroke="#EF4444" stroke-width="1.2"/>
      <g transform="translate(91.5, 781.0) scale(0.750)" stroke="#EF4444" stroke-width="2.0" fill="none" stroke-linecap="round" stroke-linejoin="round"><path d="m16 17 5-5-5-5" />
  <path d="M21 12H9" />
  <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4" /></g>
      <text x="233.0" y="795.0" class="inter" font-size="13" font-weight="600" fill="#FCA5A5" text-anchor="middle">Desconectar Todos os Dispositivos</text>
    </g>
    

    <!-- Botão Salvar -->
    
    <g cursor="pointer">
      <rect x="24" y="836" width="392" height="56" rx="28.0" fill="url(#goldGradient)" stroke="#F3D078" stroke-width="1" filter="url(#shadowCard)"/>
      <rect x="28" y="840" width="384" height="48" rx="24.0" fill="none" stroke="#090910" stroke-width="1" stroke-opacity="0.3"/>
      <g transform="translate(91.0, 854.0) scale(0.833)" stroke="#090910" stroke-width="2.2" fill="none" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6 9 17l-5-5" /></g>
      <text x="235.0" y="869.0" class="inter" font-size="14" font-weight="700" fill="#090910" text-anchor="middle">Salvar Preferências da Taverna</text>
    </g>
    
    
  
    <!-- Android Bottom Gesture Pill -->
    <rect x="166.0" y="966" width="108" height="4" rx="2" fill="#E5B758" fill-opacity="0.35"/>
    
