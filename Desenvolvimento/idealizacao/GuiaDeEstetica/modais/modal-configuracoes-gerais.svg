    <polygon points="220.0,112 225.0,116 220.0,120 215.0,116" fill="#131322" stroke="#E5B758" stroke-width="1.3"/>
    <line x1="226.0" y1="116" x2="416" y2="116" stroke="#D4A34B" stroke-width="1" stroke-opacity="0.5"/>
    
  
    <!-- Seção 1: Interface e Acessibilidade -->
    
    <g>
      <g transform="translate(24, 135) scale(0.833)" stroke="#E5B758" stroke-width="1.8" fill="none" stroke-linecap="round" stroke-linejoin="round"><path d="M9.671 4.136a2.34 2.34 0 0 1 4.659 0 2.34 2.34 0 0 0 3.319 1.915 2.34 2.34 0 0 1 2.33 4.033 2.34 2.34 0 0 0 0 3.831 2.34 2.34 0 0 1-2.33 4.033 2.34 2.34 0 0 0-3.319 1.915 2.34 2.34 0 0 1-4.659 0 2.34 2.34 0 0 0-3.32-1.915 2.34 2.34 0 0 1-2.33-4.033 2.34 2.34 0 0 0 0-3.831A2.34 2.34 0 0 1 6.35 6.051a2.34 2.34 0 0 0 3.319-1.915" />
  <circle cx="12" cy="12" r="3" /></g>
      <text x="52" y="151" class="cinzel" font-size="13.5" font-weight="700" fill="#F4F4F8">Interface &amp; Acessibilidade</text>
      <line x1="320.8" y1="146" x2="401" y2="146" stroke="#D4A34B" stroke-width="1" stroke-opacity="0.55"/>
      <polygon points="406,142 410,146 406,150 402,146" fill="none" stroke="#D4A34B" stroke-width="1.2"/>
      
