#:schema node_modules/wrangler/config-schema.json
name = "arcana-vtt-backend"
main = "src/index.ts"
compatibility_date = "2026-03-01"
compatibility_flags = ["nodejs_compat"]

[vars]
ENVIRONMENT = "production"
MIN_AGE_YEARS = "16"
SESSION_TTL_DAYS = "30"
ALLOWED_ORIGINS = "https://arcanavtt.app,http://localhost:8080,capacitor://localhost"

# Binding do banco Cloudflare D1.
# Após executar `npx wrangler d1 create arcana_vtt_db`, substitua database_id pelo ID retornado.
[[d1_databases]]
binding = "DB"
database_name = "arcana_vtt_db"
database_id = "00000000-0000-0000-0000-000000000000"
migrations_dir = "migrations"

